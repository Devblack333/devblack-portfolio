<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devblack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Devblack</h1>
    <nav>
      <a href="#gallery">Gallery</a>
      <a href="#games">Games</a>
      <a href="#discord">Discord</a>
    </nav>
  </header>

  <section id="gallery" class="gallery">
    <h2>Gallery</h2>
    <div class="gallery-grid">
      <img src="assets/images/1.jpg" alt="Model 1" />
      <img src="assets/images/2.jpg" alt="Model 2" />
      <img src="assets/images/3.jpg" alt="Model 3" />
      <img src="assets/images/4.jpg" alt="Model 4" />
    </div>
  </section>

  <section id="games" class="games">
    <h2>My Games</h2>
    <div class="game-card">
      <img src="assets/images/game1.jpg" alt="اسرق المشاهير" />
      <h3>اسرق المشاهير</h3>
      <p>Over <strong>130K+</strong> Visits • <strong>15K+</strong> Favorites</p>
      <a href="https://www.roblox.com/games/103938520476530/unnamed" target="_blank" class="btn">Play Now</a>
    </div>
  </section>

  <section id="discord" class="discord">
    <h2>Join Our Discord</h2>
    <iframe
      src="https://discord.com/widget?id=1237715531801427988&theme=dark"
      width="350"
      height="500"
      allowtransparency="true"
      frameborder="0"
      sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>
  </section>

  <footer>
    <p>© 2025 Devblack. All rights reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
